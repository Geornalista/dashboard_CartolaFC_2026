name: Atualizar Banco de Dados do Cartola

# Quando o robô deve rodar?
on:
  schedule:
    # Roda a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando num botão no GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar arquivos no repositório

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Rodar script de atualização
        run: python atualizador.py

      - name: Commitar e salvar o novo JSON no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Cartola Bot"
          git add dados_cartola.json
          # Só faz o commit se houver alguma mudança nos dados
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizando dados do Cartola 🤖" && git push)
